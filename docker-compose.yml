# Full stack: postgres + redis + api + telegram bot + static frontend
# Lives in backend/: builds this repo (api, bot) and the sibling frontend checkout.
# Usage: cp .env.example .env   (fill it in)   then: docker compose up -d --build
# Layout: /srv/checkout/backend (this repo) and /srv/checkout/frontend
name: checkout

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-checkout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checkout}
      POSTGRES_DB: ${POSTGRES_DB:-checkout}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-checkout} -d ${POSTGRES_DB:-checkout}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    command: sh -c "npm run db:migrate && npm start"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-checkout}:${POSTGRES_PASSWORD:-checkout}@db:5432/${POSTGRES_DB:-checkout}
      DB_MEMORY: postgres://${POSTGRES_USER:-checkout}:${POSTGRES_PASSWORD:-checkout}@db:5432/${POSTGRES_DB:-checkout}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build: .
    restart: unless-stopped
    command: npm run bot
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-checkout}:${POSTGRES_PASSWORD:-checkout}@db:5432/${POSTGRES_DB:-checkout}
      DB_MEMORY: postgres://${POSTGRES_USER:-checkout}:${POSTGRES_PASSWORD:-checkout}@db:5432/${POSTGRES_DB:-checkout}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      args:
        VITE_SERVER_ORIGIN: ${PUBLIC_API_ORIGIN:?set PUBLIC_API_ORIGIN}/api/v1
        VITE_API_ORIGIN: ${PUBLIC_API_ORIGIN:?set PUBLIC_API_ORIGIN}
        VITE_TELEGRAM_BOT_URL: ${TELEGRAM_BOT_URL:-https://t.me/checkout_bot}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
